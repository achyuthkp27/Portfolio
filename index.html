<style>
  /* Critical CSS — inlined to unblock FCP */
  body {
    background-color: #000;
    margin: 0;
    padding: 0;
    color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Shell loader — visible until React hydrates */
  #app-shell-loader {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  .shell-mark {
    width: 3rem;
    height: 3rem;
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background:
      radial-gradient(circle at center, rgba(16, 185, 129, 0.28), transparent 58%),
      rgba(255, 255, 255, 0.02);
    box-shadow:
      0 0 30px rgba(16, 185, 129, 0.12),
      inset 0 0 24px rgba(255, 255, 255, 0.03);
    animation: shell-pulse 1.2s ease-in-out infinite alternate;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @keyframes shell-pulse {
    from {
      transform: scale(0.96);
      opacity: 0.7;
    }

    to {
      transform: scale(1.04);
      opacity: 1;
    }
  }
</style>
</head>

<body>
  <div id="root">
    <div id="app-shell-loader">
      <div class="shell-mark" aria-hidden="true"></div>
      <span class="sr-only">Loading portfolio</span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
